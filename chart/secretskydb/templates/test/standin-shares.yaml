{{- if .Values.testShares.enabled }}
# ── TEST-ONLY: in-cluster stand-in shares for `mpdev verify` ─────────────────
# A production install never sets testShares.enabled=true — terraform provisions
# real AlloyDB and the shares Secret. For verify (no AlloyDB, no PSC) we synthesize
# the shares Secret and stand up three plain Postgres pods as shares so the app can
# install → run a real split/reconstruct query → uninstall cleanly.
#
# The synthesized Secret carries the SAME keys the chart consumes: proxy, cache,
# share-<x> (passwords) and share-<x>-host (the stand-in Service DNS names).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.alloydbShareSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretskydb.labels" . | nindent 4 }}
type: Opaque
stringData:
  proxy: {{ .Values.testShares.proxyPassword | quote }}
  cache: {{ .Values.testShares.cachePassword | quote }}
  {{- range $i, $s := .Values.shares }}
  {{ $s.name }}: {{ $.Values.testShares.sharePassword | quote }}
  {{ $s.name }}-host: {{ printf "%s-standin-%s" $.Release.Name $s.name | quote }}
  {{ $s.name }}-user: {{ $s.user | quote }}
  {{- end }}
{{- range $i, $s := .Values.shares }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-standin-{{ $s.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "secretskydb.labels" $ | nindent 4 }}
    ssdb-standin: {{ $s.name }}
spec:
  replicas: 1
  selector:
    matchLabels: { ssdb-standin: {{ $s.name }} }
  template:
    metadata:
      labels: { ssdb-standin: {{ $s.name }} }
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.testShares.image }}
          ports: [{ containerPort: {{ $s.port }} }]
          env:
            - { name: POSTGRES_USER,     value: {{ $s.user | quote }} }
            - { name: POSTGRES_DB,       value: postgres }
            - { name: POSTGRES_PASSWORD, value: {{ $.Values.testShares.sharePassword | quote }} }
            - { name: PGPORT,            value: {{ $s.port | quote }} }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ $s.user | quote }}] }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-standin-{{ $s.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "secretskydb.labels" $ | nindent 4 }}
spec:
  selector: { ssdb-standin: {{ $s.name }} }
  ports:
    - { port: {{ $s.port }}, targetPort: {{ $s.port }} }
{{- end }}
{{- end }}
