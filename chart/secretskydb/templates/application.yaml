apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretskydb.labels" . | nindent 4 }}
  annotations:
    # SecretSkyDB brand icon (200x200 PNG, docs/secretskydb-logo-200.png), embedded
    # as a data URI on a single line (block-folding would corrupt long base64).
    kubernetes-engine.cloud.google.com/icon: "data:image/png;base64,"
    marketplace.cloud.google.com/deploy-info: >-
      {"partner_id":"secretskydb","product_id":"secretskydb","partner_name":"SecretSkyDB"}
spec:
  descriptor:
    type: SecretSkyDB
    version: "{{ .Chart.AppVersion }}"
    description: >-
      Post-quantum secret-sharing database proxy for PostgreSQL/AlloyDB. Plaintext
      stays inside the proxy pod; three sub-threshold shares live on AlloyDB across
      three Google Cloud regions. Any 2 of 3 reconstruct.
    maintainers:
      - name: SecretSkyDB
        url: https://secretskydb.com
    links:
      - description: Documentation
        url: https://secretskydb.com/docs
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  componentKinds:
    - group: apps/v1
      kind: StatefulSet
    # Deployment + Secret: the `mpdev verify` stand-in shares are Deployments and the
    # synthesized shares Secret carries the app labels. They must be listed here so the
    # Marketplace set_ownership adds owner-refs to them — otherwise they aren't
    # garbage-collected on uninstall and verify fails teardown ("resources not deleted").
    # No-op in production: the chart creates no Secret/Deployment there.
    - group: apps/v1
      kind: Deployment
    - group: v1
      kind: Service
    - group: v1
      kind: ConfigMap
    - group: v1
      kind: Secret
    - group: batch/v1
      kind: Job
