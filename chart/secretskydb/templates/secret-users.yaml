{{- if and (not .Values.users.existingSecret) .Values.users.list }}
# Proxy users with roles (0.3): rendered from values.users.list into the file the proxy reads as
# SSDB_USERS_FILE. Records carry SCRAM verifiers (tools/ssdb_user.py), never passwords.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-users
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretskydb.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.json: {{ dict "users" .Values.users.list | toJson | quote }}
{{- end }}
